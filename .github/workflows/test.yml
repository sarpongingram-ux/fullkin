name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relatie-engine:
    name: Relatie-engine & discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        env:
          # Wijs naar een STAGING/branch-DB — nooit productie met echte families.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY niet ingesteld — tests overgeslagen. Zie TESTING_SETUP.md."
            exit 0
          fi
          npm test
